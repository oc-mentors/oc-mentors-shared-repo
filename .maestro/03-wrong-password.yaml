appId: com.ocmentorscorp.app
name: "3 — Wrong password"
tags:
  - auth
  - unhappy
  - journey-3
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      text: "Login|Student|Choose your role"
    timeout: 30000
- assertVisible:
    text: "Login"
- tapOn:
    text: "Student"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Email"
    timeout: 15000
- assertVisible:
    text: "Email"
- tapOn:
    text: "Email"
- inputText: ${TEST_EMAIL}
- tapOn:
    text: "Password"
- inputText: "definitely-wrong-password-maestro-e2e"
- tapOn:
    text: "Sign In"
- extendedWaitUntil:
    visible:
      text: "Sign in error"
    timeout: 15000
- assertVisible:
    text: "Sign in error"
- assertVisible:
    text: "Login"
- assertVisible:
    text: "Sign in form"
