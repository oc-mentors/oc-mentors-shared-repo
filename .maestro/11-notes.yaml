appId: com.ocmentorscorp.app
name: "11 — Notes create and delete"
tags:
  - notes
  - journey-11
---
- clearState
- launchApp
- runFlow: subflows/login-student-home.yaml
- tapOn:
    text: "Study hub|Notes"
- extendedWaitUntil:
    visible:
      text: "Notes|Study hub|Add note"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: "Notes"
    commands:
      - tapOn:
          text: "Notes"
- assertVisible:
    text: "Add note|Note title|Save note"
- tapOn:
    text: "Note title|Title"
- inputText: "maestro-e2e-note"
- tapOn:
    text: "Note content|Content"
- inputText: "maestro note body"
- tapOn:
    text: "Save note"
- extendedWaitUntil:
    visible:
      text: "maestro-e2e-note"
    timeout: 10000
- assertVisible:
    text: "maestro-e2e-note"
- tapOn:
    text: "Delete note"
    index: 0
- assertNotVisible:
    text: "maestro-e2e-note"
